<style>
:root{--bg:#f5f7ff;--card:#fff;--ink:#101b4d;--muted:#7a839b;--accent:#0027a3;--accent2:#2458ff;--ok:#27ae60;--warn:#f6b93b;--bad:#e74c3c;--rev:#9b59b6;--wa:#25d366;--line:#e0e6f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:#fff;color:var(--accent);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--accent2)}
header img.logo{height:30px}
header h1{font-size:17px;margin-inline-end:auto;color:var(--accent);font-weight:600}
.chip{background:#eef2ff;border:none;color:var(--accent);padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer}
.chip:hover{background:#dbe4ff}
#connDot{width:10px;height:10px;border-radius:50%;background:var(--warn);display:inline-block}
nav{display:flex;gap:4px;background:var(--card);padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
nav button.active{background:var(--accent);color:#fff}
main{padding:16px;max-width:1300px;margin:0 auto}
.grid{display:grid;gap:12px}
.cards4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.big{font-size:28px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col h3{font-size:14px;padding:4px 6px;display:flex;justify-content:space-between}
.col[data-status="review"] h3 span:first-child{color:var(--rev)}
.task{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.task b{display:block;font-size:14px;margin-bottom:4px}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.task.overdue{border-inline-start:4px solid var(--bad)}
.task.returned{border-inline-start:4px solid var(--warn)}
.task .actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.task .actions button,.task .actions a{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.task .actions .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.task .actions .warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.wa{background:var(--wa)!important;color:#fff!important;border-color:var(--wa)!important}
.ptag{background:#eef3fb;color:var(--accent2);border-radius:4px;padding:1px 6px;font-size:11px}
.rtag{background:#f5eefb;color:var(--rev);border-radius:4px;padding:1px 6px;font-size:11px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.btn{background:var(--accent2);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn.gray{background:var(--muted)}
.btn.red{background:var(--bad)}
.btn.green{background:var(--ok)}
.btn.sm{padding:5px 10px;font-size:12px}
table.cal{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
table.cal th{padding:8px;background:var(--accent);color:#fff;font-size:12px}
table.cal td{border:1px solid var(--line);vertical-align:top;height:88px;width:14.28%;padding:4px;cursor:pointer;font-size:12px}
table.cal td:hover{background:#eef3fb}
table.cal td.today{background:#e8f0fe}
.calTask{background:var(--accent2);color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calTask.done{background:var(--ok)}
.member{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.member:last-child{border-bottom:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.member .info{flex:1;min-width:140px}
.feed{padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.feed .muted{font-size:11px}
.overlay{position:fixed;inset:0;background:rgba(22,33,62,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.modal h2{font-size:17px;margin-bottom:12px}
.modal label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.modal .row{display:flex;gap:10px}.modal .row>div{flex:1}
.modal .foot{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.modal .note{background:#fff8e1;border-radius:8px;padding:10px;font-size:12px;margin-top:10px;color:#7a6520}
.modal .err{background:#fdecea;border-radius:8px;padding:10px;font-size:12px;margin-top:10px;color:var(--bad);display:none}
.checkitem{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:14px}
.checkitem input{width:auto}
.projcard{margin-bottom:12px}
.projcard .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.projcard .chips span{background:#eef3fb;border-radius:12px;padding:3px 10px;font-size:12px}
.comment{background:#f7f8fb;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
.comment .muted{font-size:11px}
.attach{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:5px 0;font-size:13px}
.attach a{color:var(--accent2);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#authBox{max-width:380px}
#authBox .logo{font-size:34px;text-align:center;margin-bottom:6px}
@media(max-width:640px){header h1{font-size:15px}main{padding:10px}}
</style>
</head>

  <h1 data-i="headerTitle">Tasks</h1>
  <button class="chip" id="notifBtn"></button>
  <button class="chip" id="emailCfgBtn">✉️</button>
  <button class="chip" id="exportBtn"></button>
  <button class="chip" id="importBtn"></button>
  <input type="file" id="importFile" accept=".json" style="display:none">
  <button class="chip" id="langBtn">العربية</button>
  <button class="chip" id="meChip"></button>
</header>
<nav>
  <button data-view="dashboard" class="active"></button>
  <button data-view="board"></button>
  <button data-view="projects"></button>
  <button data-view="calendar"></button>
  <button data-view="team"></button>
  <button data-view="activity"></button>
</nav>
<main>
  <div id="view-dashboard">
    <div class="grid cards4" id="statCards"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:12px">
      <div class="card"><h3 data-i="teamProgress"></h3><div id="progressList"></div></div>
      <div class="card"><h3 data-i="upcoming"></h3><div id="upcomingList"></div></div>
    </div>
  </div>
  <div id="view-board" style="display:none">
    <div class="toolbar">
      <button class="btn" id="addTaskBtn"></button>
      <input id="searchBox" style="flex:1;min-width:120px">
      <select id="filterPerson"></select>
      <select id="filterProject"></select>
      <label style="font-size:13px"><input type="checkbox" id="onlyMine"> <span data-i="myTasks"></span></label>
    </div>
    <div class="cols">
      <div class="col" data-status="todo"><h3><span data-i="todo"></span><span class="muted" id="cnt-todo"></span></h3><div class="drop" id="list-todo"></div></div>
      <div class="col" data-status="inprogress"><h3><span data-i="inprogress"></span><span class="muted" id="cnt-inprogress"></span></h3><div class="drop" id="list-inprogress"></div></div>
      <div class="col" data-status="review"><h3><span data-i="review"></span><span class="muted" id="cnt-review"></span></h3><div class="drop" id="list-review"></div></div>
      <div class="col" data-status="done"><h3><span data-i="done"></span><span class="muted" id="cnt-done"></span></h3><div class="drop" id="list-done"></div></div>
    </div>
  </div>
  <div id="view-projects" style="display:none">
    <div class="toolbar"><button class="btn" id="addProjBtn"></button></div>
    <div id="projList"></div>
  </div>
  <div id="view-calendar" style="display:none">
    <div class="toolbar">
      <button class="btn gray" id="prevM">&#8249;</button>
      <b id="monthLabel" style="min-width:150px;text-align:center"></b>
      <button class="btn gray" id="nextM">&#8250;</button>
    </div>
    <table class="cal"><thead id="calHead"></thead><tbody id="calBody"></tbody></table>
    <p class="muted" style="margin-top:8px" data-i="calHint"></p>
  </div>
  <div id="view-team" style="display:none">
    <div class="card" id="memberList"></div>
    <p class="muted" style="margin-top:8px" data-i="teamHint"></p>
  </div>
  <div id="view-activity" style="display:none">
    <div class="card" id="feedList"></div>
  </div>
</main>

<!-- Task modal -->
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <h2 id="taskModalTitle"></h2>
    <label data-i="taskTitle"></label><input id="f_title">
    <label data-i="taskDesc"></label><textarea id="f_desc" rows="2"></textarea>
    <div class="row">
      <div><label data-i="assignee"></label><select id="f_assignee"></select></div>
      <div><label data-i="project"></label><select id="f_project"></select></div>
    </div>
    <div class="row">
      <div><label data-i="dueDate"></label><input type="date" id="f_date"></div>
      <div><label data-i="dueTime"></label><input type="time" id="f_time"></div>
    </div>
    <label data-i="status"></label>
    <select id="f_status"><option value="todo"></option><option value="inprogress"></option><option value="review"></option><option value="done"></option></select>
    <div id="taskExtras" style="display:none">
      <label data-i="attachments"></label>
      <div id="attachList"></div>
      <div class="row" style="align-items:center">
        <div><input type="file" id="f_file" style="font-size:12px"></div>
      </div>
      <div class="row" style="margin-top:6px">
        <div><input id="f_link" placeholder="https://drive.google.com/..."></div>
        <div style="flex:0"><button class="btn sm" id="addLinkBtn"></button></div>
      </div>
      <label data-i="comments"></label>
      <div id="commentList"></div>
      <div class="row" style="margin-top:6px">
        <div><input id="f_comment"></div>
        <div style="flex:0"><button class="btn sm" id="addCommentBtn"></button></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn red" id="delTaskBtn" style="display:none"></button>
      <button class="btn gray" id="cancelTaskBtn"></button>
      <button class="btn" id="saveTaskBtn"></button>
    </div>
  </div>
</div>

<!-- Project modal -->
<div class="overlay" id="projOverlay">
  <div class="modal">
    <h2 id="projModalTitle"></h2>
    <label data-i="projectName"></label><input id="p_name">
    <label data-i="projectMembers"></label>
    <div id="p_members"></div>
    <div class="foot">
      <button class="btn red" id="delProjBtn" style="display:none"></button>
      <button class="btn gray" id="cancelProjBtn"></button>
      <button class="btn" id="saveProjBtn"></button>
    </div>
  </div>
</div>

<!-- Member modal -->
<div class="overlay" id="memOverlay">
  <div class="modal">
    <h2 data-i="editMember"></h2>
    <label data-i="memberName"></label><input id="m_name">
    <label data-i="memberEmail"></label><input id="m_email" type="email" placeholder="name@example.com">
    <label data-i="memberWhatsapp"></label><input id="m_wa" placeholder="+201001234567">
    <label data-i="role"></label>
    <select id="m_role"><option value="member"></option><option value="manager"></option><option value="head"></option></select>
    <label data-i="managerL"></label>
    <select id="m_manager"></select>
    <div id="m_teamWrap" style="display:none"><label data-i="mTeam"></label><div id="m_team"></div></div>
    <div class="foot">
      <button class="btn gray" id="cancelMemBtn"></button>
      <button class="btn" id="saveMemBtn"></button>
    </div>
  </div>
</div>

<!-- Email settings modal -->
<div class="overlay" id="emailOverlay">
  <div class="modal">
    <h2 data-i="emailSettings"></h2>
    <p class="muted" data-i="emailInfo"></p>
    <label>Service ID</label><input id="e_service" placeholder="service_xxxxxxx">
    <label>Template ID</label><input id="e_template" placeholder="template_xxxxxxx">
    <label>Public Key</label><input id="e_key" placeholder="XXXXXXXXXXXXXXX">
    <div class="checkitem" style="margin-top:10px"><input type="checkbox" id="e_enabled"><span data-i="digestOn"></span></div>
    <div class="note" data-i="emailNote"></div>
    <div class="foot">
      <button class="btn gray" id="cancelEmailBtn"></button>
      <button class="btn" id="saveEmailBtn"></button>
    </div>
  </div>
</div>

<!-- Auth -->

auth.onAuthStateChanged(user => {

$("a_toggle").onclick = () => { signupMode = !signupMode; $("a_nameWrap").style.display = signupMode ? "" : "none"; $("a_err").style.display = "none"; applyLang(); };

/* ---------- Firestore live sync (after login) ---------- */
function startData(){
  if(dataStarted) return;
  dataStarted = true;
  db.collection("members").orderBy("name").onSnapshot(s => {
    members = s.docs.map(d => ({id:d.id, ...d.data()}));
    resolveMe();
    fillPersonSelects(); renderAll(); maybeDigest();
  });
  db.collection("projects").orderBy("name").onSnapshot(s => {
    projects = s.docs.map(d => ({id:d.id, ...d.data()}));
    fillProjectSelects(); renderAll();
  });
  db.collection("tasks").onSnapshot(s => {
    if(!firstTasksLoad){
      s.docChanges().forEach(ch => {
        const d = ch.doc.data();
        if(ch.type === "added" && d.assignee === me && d.createdBy !== me) notify(t("nAssigned"), d.title);
        if(ch.type === "modified"){
          if(d.status === "done" && d.approvedBy && d.approvedBy !== me && d.assignee === me) notify(d.approvedBy + " " + t("nDone"), d.title);
          if(d.status === "inprogress" && d.returnedBy && d.assignee === me && d.returnedBy !== me) notify(t("nReturned"), d.title);
          if(d.status === "review" && d.assignee !== me && canReview(d)) notify(t("nReview"), d.title);
        }
      });
    }
    firstTasksLoad = false;
    tasks = s.docs.map(d => ({id:d.id, ...d.data()}));
    renderAll(); maybeDigest();
    if(editingId) renderTaskExtras();
  });
  db.collection("activity").orderBy("at","desc").limit(40).onSnapshot(s => {
    feed = s.docs.map(d => d.data());
    renderFeed();
  });
  db.collection("meta").doc("ping").set({t:Date.now()}).then(()=>setConn(true)).catch(()=>setConn(false));
}
function resolveMe(){
  const m = members.find(x => (x.email||"").toLowerCase() === authedEmail);
  if(m){ me = m.name; }
  else if(authedEmail && signupName){
    const nm = signupName; signupName = null;
    db.collection("members").add({name:nm, email:authedEmail, whatsapp:"", role:"member", manager:"", team:[]});
    me = nm;
  }
  else if(authedEmail && !me){
    const nm = authedEmail.split("@")[0];
    if(members.length && !members.some(x => x.name === nm)){
      db.collection("members").add({name:nm, email:authedEmail, whatsapp:"", role:"member", manager:"", team:[]});
    }
    me = nm;
  }
  $("meChip").textContent = "👤 " + (me || "…") + " · " + t("signout");
}
function setConn(ok){ $("connDot").style.background = ok ? "var(--ok)" : "var(--bad)"; }
function logAct(text){ db.collection("activity").add({who:me||"?", text, at:firebase.firestore.FieldValue.serverTimestamp()}); }

/* ---------- Helpers ---------- */
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dueMs(x){ if(!x.date) return null; return new Date(x.date + "T" + (x.time || "23:59")).getTime(); }
function isOverdue(x){ const m = dueMs(x); return m !== null && x.status !== "done" && m < Date.now(); }
function fmtDue(x){ if(!x.date) return ""; return x.date + (x.time ? " " + x.time : ""); }
function projName(id){ const p = projects.find(z => z.id === id); return p ? p.name : ""; }
function memberByName(n){ return members.find(m => m.name === n); }
function myProfile(){ return memberByName(me) || {}; }
function roleOf(p){ return p.role || "member"; }
function subordinateNames(){
  const p = myProfile();
  const set = new Set(p.team || []);
  members.forEach(m => { if(m.manager === me) set.add(m.name); });
  return set;
}
function canSee(x){
  const r = roleOf(myProfile());
  if(r === "head") return true;
  if(r === "manager") return x.assignee === me || subordinateNames().has(x.assignee);
  return x.assignee === me;
}
function canReview(x){
  if(roleOf(myProfile()) === "head") return true;
  return subordinateNames().has(x.assignee);
}
function visibleTasks(){ return me ? tasks.filter(canSee) : []; }
function visibleMembers(){
  const r = roleOf(myProfile());
  if(!me) return [];
  if(r === "head") return members;
  if(r === "manager") return members.filter(m => m.name === me || subordinateNames().has(m.name));
  return members.filter(m => m.name === me);
}
function waLink(num, text){ return "https://wa.me/" + (num||"").replace(/[^0-9]/g,"") + "?text=" + encodeURIComponent(text); }

/* ---------- Rendering ---------- */
function renderAll(){ renderStats(); renderBoard(); renderProjects(); renderCalendar(); renderMembers(); }

function renderStats(){
  const vt = visibleTasks();
  const open = vt.filter(x => x.status !== "done").length;
  const od = vt.filter(isOverdue).length;
  const done = vt.filter(x => x.status === "done").length;
  $("statCards").innerHTML =
    card(t("total"), vt.length, "var(--accent2)") + card(t("open"), open, "var(--warn)") +
    card(t("overdueN"), od, "var(--bad)") + card(t("doneN"), done, "var(--ok)");
  function card(l, n, c){ return `<div class="card"><div class="muted">${l}</div><div class="big" style="color:${c}">${n}</div></div>`; }
  $("progressList").innerHTML = visibleMembers().map(m => {
    const mine = vt.filter(x => x.assignee === m.name);
    const d = mine.filter(x => x.status === "done").length;
    const pct = mine.length ? Math.round(d / mine.length * 100) : 0;
    return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(m.name)}</span><span class="muted">${d}/${mine.length}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("") || `<p class="muted">${t("noTasks")}</p>`;
  const week = Date.now() + 7 * 864e5;
  const up = vt.filter(x => { const m = dueMs(x); return m && x.status !== "done" && m > Date.now() && m < week; })
    .sort((a,b) => dueMs(a) - dueMs(b)).slice(0, 8);
  $("upcomingList").innerHTML = up.map(x =>
    `<div class="feed"><b>${esc(x.title)}</b> — ${esc(x.assignee||"")}<div class="muted">${fmtDue(x)}</div></div>`
  ).join("") || `<p class="muted">${t("noTasks")}</p>`;
}

function renderBoard(){
  const q = ($("searchBox").value || "").toLowerCase();
  const fp = $("filterPerson").value;
  const fpr = $("filterProject").value;
  const mine = $("onlyMine").checked;
  ["todo","inprogress","review","done"].forEach(st => {
    const list = visibleTasks().filter(x => (x.status||"todo") === st)
      .filter(x => !q || (x.title||"").toLowerCase().includes(q) || (x.desc||"").toLowerCase().includes(q))
      .filter(x => !fp || x.assignee === fp)
      .filter(x => !fpr || x.project === fpr)
      .filter(x => !mine || x.assignee === me)
      .sort((a,b) => (dueMs(a)||9e15) - (dueMs(b)||9e15));
    $("cnt-" + st).textContent = list.length;
    $("list-" + st).innerHTML = list.map(x => {
      const mem = memberByName(x.assignee);
      const wa = (mem && mem.whatsapp && st !== "done" && x.assignee !== me)
        ? `<a class="wa" target="_blank" href="${waLink(mem.whatsapp, t("waText") + ': ' + x.title + (x.date ? ' (' + fmtDue(x) + ')' : ''))}">WhatsApp</a>` : "";
      const nC = (x.comments||[]).length, nF = (x.files||[]).length;
      let act = "";
      if(st === "todo") act = `<button onclick="setStatus('${x.id}','inprogress')">➜ ${t("inprogress")}</button>`;
      if(st === "inprogress") act = `<button onclick="ownerDone('${x.id}')">${canReview(x) && x.assignee !== me ? t("approve") : t("submitDone")}</button>`;
      if(st === "review" && canReview(x) && x.assignee !== me)
        act = `<button class="ok" onclick="approveTask('${x.id}')">${t("approve")}</button><button class="warn" onclick="returnTask('${x.id}')">${t("returnT")}</button>`;
      return `
      <div class="task ${isOverdue(x) ? "overdue" : ""} ${x.returnedBy && st === "inprogress" ? "returned" : ""}" draggable="true" data-id="${x.id}">
        <b>${esc(x.title)}</b>
        <div class="meta"><span>👤 ${esc(x.assignee||"—")}</span>${x.project ? `<span class="ptag">${esc(projName(x.project))}</span>` : ""}${x.date ? `<span>📅 ${fmtDue(x)}</span>` : ""}${nC ? `<span>💬 ${nC}</span>` : ""}${nF ? `<span>📎 ${nF}</span>` : ""}</div>
        ${st === "review" ? `<div class="muted" style="font-size:11px">${t("waiting")} ${esc((memberByName(x.assignee)||{}).manager || "…")}</div>` : ""}
        ${x.returnedBy && st === "inprogress" ? `<span class="rtag">${t("returnedTag")}: ${esc(x.returnedBy)}</span>` : ""}
        ${st === "done" && x.approvedBy ? `<div class="muted" style="font-size:11px">✔ ${t("approvedByL")} ${esc(x.approvedBy)}</div>` : ""}
        <div class="actions">${act}<button onclick="openTask('${x.id}')">✎ 💬 📎</button>${wa}</div>
      </div>`; }).join("");
  });
  document.querySelectorAll(".task[draggable]").forEach(el => {
    el.addEventListener("dragstart", e => e.dataTransfer.setData("id", el.dataset.id));
  });
}
document.querySelectorAll(".col").forEach(col => {
  col.addEventListener("dragover", e => e.preventDefault());
  col.addEventListener("drop", e => {
    e.preventDefault();
    const id = e.dataTransfer.getData("id");
    if(id) setStatus(id, col.dataset.status);
  });
});

function renderProjects(){
  $("projList").innerHTML = projects.map(p => {

    return `<div class="card projcard">

      </div>

      <div class="muted">${d}/${pt.length} ${t("tasksN")} — ${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join("") || `<div class="card"><p class="muted">${t("noTasks")}</p></div>`;

function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const names = (lang === "ar") ? ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"] : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  $("calHead").innerHTML = "<tr>" + names.map(n => `<th>${n}</th>`).join("") + "</tr>";
  $("monthLabel").textContent = calDate.toLocaleDateString(lang === "ar" ? "ar-EG" : "en-US", {month:"long", year:"numeric"});
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toLocaleDateString("sv");
  let html = "<tr>", cell = 0;
  for(let i = 0; i < first; i++){ html += "<td></td>"; cell++; }
  for(let d = 1; d <= days; d++){
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayTasks = visibleTasks().filter(x => x.date === ds);
    html += `<td class="${ds === todayStr ? "today" : ""}" onclick="dayClick(event,'${ds}')"><b>${d}</b>` +
      dayTasks.slice(0,3).map(x => `<div class="calTask ${x.status === "done" ? "done" : ""}" onclick="event.stopPropagation();openTask('${x.id}')">${x.time ? x.time + " " : ""}${esc(x.title)}</div>`).join("") +
      (dayTasks.length > 3 ? `<div class="muted">+${dayTasks.length - 3}</div>` : "") + "</td>";
    cell++;
    if(cell % 7 === 0) html += "</tr><tr>";
  }
  $("calBody").innerHTML = html + "</tr>";
}
window.dayClick = (e, ds) => { openTask(null, ds); };
$("prevM").onclick = () => { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); };
$("nextM").onclick = () => { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); };

function renderMembers(){
  const isHead = roleOf(myProfile()) === "head";
  $("memberList").innerHTML = members.map(mm => {
    const mine = tasks.filter(x => x.assignee === mm.name);
    const d = mine.filter(x => x.status === "done").length;

    ].filter(Boolean).join(" &nbsp; ");
    const mgr = mm.manager ? `<span class="ptag">⬆ ${esc(mm.manager)}</span>` : "";
    const btns = isHead ? `<button class="btn sm" onclick="openMem('${mm.id}')">${t("edit")}</button>
      <button class="btn sm red" onclick="removeMember('${mm.id}','${esc(mm.name)}')">${t("removeM")}</button>`
      : (mm.name === me ? `<button class="btn sm" onclick="openMem('${mm.id}')">${t("edit")}</button>` : "");
    return `<div class="member"><div class="avatar">${esc((mm.name||"?")[0].toUpperCase())}</div>
      <div class="info"><b>${esc(mm.name)}</b> <span class="ptag">${t(roleKey)}</span> ${mgr}<div class="muted">${pct}% ${t("completion")} (${d}/${mine.length})</div>
      <div class="muted" style="margin-top:2px">${contacts}</div></div>${btns}</div>`;

function renderFeed(){
  $("feedList").innerHTML = feed.map(f => {

  }).join("") || `<p class="muted" style="padding:10px">${t("noTasks")}</p>`;

function fillPersonSelects(){
  const opts = visibleMembers().map(m => `<option>${esc(m.name)}</option>`).join("");
  $("filterPerson").innerHTML = `<option value="">${t("all")}</option>` + opts;
  $("f_assignee").innerHTML = opts;
}
function fillProjectSelects(){
  const opts = projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("filterProject").innerHTML = `<option value="">${t("allProjects")}</option>` + opts;
  $("f_project").innerHTML = `<option value="">${t("noProject")}</option>` + opts;
}

/* ---------- Review workflow ---------- */
window.setStatus = (id, st) => {
  const x = tasks.find(z => z.id === id);
  if(!x) return;
  const upd = {status:st};
  if(st === "done"){
    if(!(canReview(x) && x.assignee !== me)){ // owner or non-reviewer → mandatory review
      upd.status = "review"; upd.submittedBy = me;
    } else {
      upd.completedBy = x.assignee; upd.approvedBy = me; upd.returnedBy = "";
    }
  }
  if(st === "review"){ upd.submittedBy = me; }
  if(st === "inprogress" && x.status === "review"){ /* dragging back = return */ }
  db.collection("tasks").doc(id).update(upd);
  logAct(`${t("actMoved")} "${x.title}" ${t("to")} ${t(upd.status)}`);
};
window.ownerDone = id => setStatus(id, "done");
window.approveTask = id => {
  const x = tasks.find(z => z.id === id); if(!x) return;
  db.collection("tasks").doc(id).update({status:"done", completedBy:x.assignee, approvedBy:me, returnedBy:""});
  logAct(`${t("actApproved")} "${x.title}"`);
};
window.returnTask = id => {
  const x = tasks.find(z => z.id === id); if(!x) return;
  const reason = prompt(t("amendReason")) || "";
  const upd = {status:"inprogress", returnedBy:me};
  db.collection("tasks").doc(id).update(upd);
  if(reason) addCommentTo(id, "↩ " + reason);
  logAct(`${t("actReturned")} "${x.title}"`);
};

/* ---------- Task CRUD ---------- */
window.openTask = (id, presetDate) => {
  editingId = id;
  $("taskModalTitle").textContent = id ? t("editTask") : t("newTask");
  $("delTaskBtn").style.display = id ? "" : "none";
  $("taskExtras").style.display = id ? "" : "none";
  const x = id ? tasks.find(z => z.id === id) : null;
  $("f_title").value = x ? x.title : "";
  $("f_desc").value = x ? (x.desc||"") : "";
  fillPersonSelects(); fillProjectSelects();
  $("f_assignee").value = x ? (x.assignee||"") : (me||"");
  $("f_project").value = x ? (x.project||"") : "";
  $("f_date").value = x ? (x.date||"") : (presetDate||"");
  $("f_time").value = x ? (x.time||"") : "";
  $("f_status").value = x ? (x.status||"todo") : "todo";
  $("f_comment").value = ""; $("f_link").value = ""; $("f_file").value = "";
  if(id) renderTaskExtras();
  $("taskOverlay").classList.add("show");
};
function renderTaskExtras(){
  const x = tasks.find(z => z.id === editingId);
  if(!x) return;
  $("commentList").innerHTML = (x.comments||[]).map(c =>
    `<div class="comment"><b>${esc(c.by)}</b>: ${esc(c.text)}<div class="muted">${c.at ? new Date(c.at).toLocaleString() : ""}</div></div>`).join("") || `<p class="muted">${t("noTasks")}</p>`;
  $("attachList").innerHTML = (x.files||[]).map((f,i) =>
    `<div class="attach">📎 <a ${f.url ? `href="${esc(f.url)}" target="_blank"` : `href="${f.data}" download="${esc(f.name)}"`}>${esc(f.name)}</a><span class="muted">${esc(f.by||"")}</span></div>`).join("") || `<p class="muted">${t("noTasks")}</p>`;
}
function addCommentTo(id, text){
  db.collection("tasks").doc(id).update({comments: firebase.firestore.FieldValue.arrayUnion({by:me, text, at:Date.now()})});
}
$("addCommentBtn").onclick = () => {
  const txt = $("f_comment").value.trim();
  if(!txt || !editingId) return;
  addCommentTo(editingId, txt);
  $("f_comment").value = "";
};
$("addLinkBtn").onclick = () => {
  const url = $("f_link").value.trim();
  if(!url || !editingId) return;
  db.collection("tasks").doc(editingId).update({files: firebase.firestore.FieldValue.arrayUnion({name:url.replace(/^https?:\/\//,"").slice(0,60), url, by:me, at:Date.now()})});
  $("f_link").value = "";
};
$("f_file").onchange = () => {
  const f = $("f_file").files[0];
  if(!f || !editingId) return;
  const r = new FileReader();
  r.onload = () => {
    if(r.result.length > 950000){ alert(t("fileTooBig")); $("f_file").value = ""; return; }
    db.collection("tasks").doc(editingId).update({files: firebase.firestore.FieldValue.arrayUnion({name:f.name, data:r.result, by:me, at:Date.now()})});
    $("f_file").value = "";
  };
  r.readAsDataURL(f);
};
$("addTaskBtn").onclick = () => openTask(null);
$("cancelTaskBtn").onclick = () => { editingId = null; $("taskOverlay").classList.remove("show"); };
$("saveTaskBtn").onclick = () => {
  const title = $("f_title").value.trim();
  if(!title) return;
  const data = {title, desc:$("f_desc").value.trim(), assignee:$("f_assignee").value, project:$("f_project").value,
    date:$("f_date").value, time:$("f_time").value};
  const newStatus = $("f_status").value;
  if(editingId){
    const x = tasks.find(z => z.id === editingId);
    if(x && newStatus !== x.status){
      db.collection("tasks").doc(editingId).update(data);
      setStatus(editingId, newStatus);
    } else {
      data.status = x ? x.status : newStatus;
      db.collection("tasks").doc(editingId).update(data);
    }
  } else {
    data.status = (newStatus === "done") ? "review" : newStatus;
    data.createdBy = me;
    data.comments = []; data.files = [];
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    db.collection("tasks").add(data);
    logAct(`${t("actCreated")} "${title}" → ${data.assignee}`);
  }
  editingId = null;
  $("taskOverlay").classList.remove("show");
};
$("delTaskBtn").onclick = () => {
  if(!editingId || !confirm(t("confirmDelT"))) return;
  const x = tasks.find(z => z.id === editingId);
  db.collection("tasks").doc(editingId).delete();
  logAct(`${t("actDeleted")} "${x ? x.title : ""}"`);
  editingId = null;
  $("taskOverlay").classList.remove("show");
};

/* ---------- Projects ---------- */
window.openProj = id => {
  editingProjId = id;
  const p = id ? projects.find(z => z.id === id) : null;
  $("projModalTitle").textContent = id ? t("editProject") : t("newProject");
  $("delProjBtn").style.display = id ? "" : "none";
  $("p_name").value = p ? p.name : "";
  const sel = p ? (p.members||[]) : [];
  $("p_members").innerHTML = members.map(m =>
    `<label class="checkitem"><input type="checkbox" value="${esc(m.name)}" ${sel.includes(m.name) ? "checked" : ""}> ${esc(m.name)}</label>`).join("");
  $("projOverlay").classList.add("show");
};
$("addProjBtn").onclick = () => openProj(null);
$("cancelProjBtn").onclick = () => $("projOverlay").classList.remove("show");
$("saveProjBtn").onclick = () => {
  const name = $("p_name").value.trim();
  if(!name) return;
  const sel = Array.from($("p_members").querySelectorAll("input:checked")).map(i => i.value);
  if(editingProjId){ db.collection("projects").doc(editingProjId).update({name, members:sel}); }
  else{ db.collection("projects").add({name, members:sel, createdBy:me}); logAct(`${t("actProj")} "${name}"`); }
  $("projOverlay").classList.remove("show");
};
$("delProjBtn").onclick = () => {
  if(!editingProjId || !confirm(t("confirmDelP"))) return;
  tasks.filter(x => x.project === editingProjId).forEach(x => db.collection("tasks").doc(x.id).update({project:""}));
  db.collection("projects").doc(editingProjId).delete();
  $("projOverlay").classList.remove("show");
};

/* ---------- Members ---------- */
window.openMem = id => {
  editingMemId = id;
  const m = members.find(z => z.id === id);
  $("m_name").value = m ? m.name : "";
  $("m_email").value = m ? (m.email||"") : "";
  $("m_wa").value = m ? (m.whatsapp||"") : "";
  $("m_role").value = (m && m.role) ? m.role : "member";
  $("m_manager").innerHTML = `<option value="">${t("noManager")}</option>` +
    members.filter(x => x.id !== id).map(x => `<option>${esc(x.name)}</option>`).join("");
  $("m_manager").value = (m && m.manager) ? m.manager : "";
  const isHead = roleOf(myProfile()) === "head";
  $("m_role").disabled = !isHead;
  $("m_manager").disabled = !isHead;
  renderTeamPicker(m);
  applyLang();
  $("memOverlay").classList.add("show");
};
function renderTeamPicker(m){
  const show = $("m_role").value === "manager";
  $("m_teamWrap").style.display = show ? "" : "none";
  if(!show) return;
  const sel = (m && m.team) ? m.team : [];
  const dis = roleOf(myProfile()) !== "head" ? "disabled" : "";
  $("m_team").innerHTML = members.filter(x => x.id !== editingMemId).map(x =>
    `<label class="checkitem"><input type="checkbox" ${dis} value="${esc(x.name)}" ${sel.includes(x.name) ? "checked" : ""}> ${esc(x.name)}</label>`).join("");
}
$("m_role").onchange = () => renderTeamPicker(members.find(z => z.id === editingMemId));
$("cancelMemBtn").onclick = () => $("memOverlay").classList.remove("show");
$("saveMemBtn").onclick = () => {
  const name = $("m_name").value.trim();
  if(!name || !editingMemId) return;
  const old = members.find(z => z.id === editingMemId);
  const upd = {name, email:$("m_email").value.trim().toLowerCase(), whatsapp:$("m_wa").value.trim()};
  if(roleOf(myProfile()) === "head"){
    upd.role = $("m_role").value;
    upd.manager = $("m_manager").value;
    upd.team = (upd.role === "manager") ? Array.from($("m_team").querySelectorAll("input:checked")).map(i => i.value) : [];
  }
  db.collection("members").doc(editingMemId).update(upd);
  if(old && old.name !== name){
    tasks.filter(x => x.assignee === old.name).forEach(x => db.collection("tasks").doc(x.id).update({assignee:name}));
    projects.filter(p => (p.members||[]).includes(old.name)).forEach(p =>
      db.collection("projects").doc(p.id).update({members:p.members.map(n => n === old.name ? name : n)}));
    members.filter(mm => mm.id !== editingMemId && mm.manager === old.name).forEach(mm =>
      db.collection("members").doc(mm.id).update({manager:name}));
    if(me === old.name) me = name;
  }
  $("memOverlay").classList.remove("show");
};
window.removeMember = (id, name) => {
  if(confirm(t("confirmDelM"))){ db.collection("members").doc(id).delete(); logAct(`${t("actRemoved")} ${name}`); }
};

/* ---------- Browser notifications ---------- */
function notify(title, body){
  if(typeof Notification !== "undefined" && Notification.permission === "granted") new Notification(title, {body});
}
$("notifBtn").onclick = async () => {
  if(!("Notification" in window)) return;
  await Notification.requestPermission();
  applyLang();
};
setInterval(() => {
  tasks.forEach(x => {
    const m = dueMs(x);
    if(!m || x.status === "done" || x.assignee !== me) return;
    const diff = m - Date.now();
    if(diff > 0 && diff < 15 * 60000 && !notified.has(x.id + "due")){ notified.add(x.id + "due"); notify(`"${x.title}" ${t("nDue")}`, fmtDue(x)); }
    if(diff < 0 && !notified.has(x.id + "od")){ notified.add(x.id + "od"); notify(`"${x.title}" ${t("nOverdue")}`, fmtDue(x)); }
  });
}, 60000);

/* ---------- Daily email digest (EmailJS) ---------- */
$("emailCfgBtn").onclick = async () => {
  const doc = await db.collection("meta").doc("emailcfg").get();
  const c = doc.exists ? doc.data() : {};
  $("e_service").value = c.serviceId || "";
  $("e_template").value = c.templateId || "";
  $("e_key").value = c.publicKey || "";
  $("e_enabled").checked = !!c.enabled;
  $("emailOverlay").classList.add("show");
};
$("cancelEmailBtn").onclick = () => $("emailOverlay").classList.remove("show");
$("saveEmailBtn").onclick = () => {
  db.collection("meta").doc("emailcfg").set({
    serviceId:$("e_service").value.trim(), templateId:$("e_template").value.trim(),
    publicKey:$("e_key").value.trim(), enabled:$("e_enabled").checked});
  $("emailOverlay").classList.remove("show");
};
function maybeDigest(){
  if(digestTried || !members.length || firstTasksLoad) return;
  digestTried = true;
  setTimeout(runDailyDigest, 3000);
}
async function runDailyDigest(){
  try{
    const cfgDoc = await db.collection("meta").doc("emailcfg").get();
    if(!cfgDoc.exists) return;
    const cfg = cfgDoc.data();
    if(!cfg.enabled || !cfg.serviceId || !cfg.templateId || !cfg.publicKey) return;
    const today = new Date().toLocaleDateString("sv");
    const dRef = db.collection("meta").doc("digest");
    const claimed = await db.runTransaction(async tr => {
      const d = await tr.get(dRef);
      if(d.exists && d.data().last === today) return false;
      tr.set(dRef, {last:today, by:me||"?"});
      return true;
    });
    if(!claimed) return;
    members.filter(m => m.email).forEach(m => {
      const pending = tasks.filter(x => x.assignee === m.name && x.status !== "done");
      if(!pending.length) return;
      const msg = pending.map(x =>
        "• " + x.title + (x.project ? " [" + projName(x.project) + "]" : "") + (x.status === "review" ? " (in review)" : "") + (x.date ? " — due " + fmtDue(x) : "") + (isOverdue(x) ? " (OVERDUE)" : "")
      ).join("\n");
      fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({service_id:cfg.serviceId, template_id:cfg.templateId, user_id:cfg.publicKey,
          template_params:{to_email:m.email, to_name:m.name, message:msg}})
      });
    });
  }catch(e){ /* silent */ }
}

/* ---------- Export / import ---------- */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({tasks, members, projects}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "team-tasks-backup.json";
  a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      (d.tasks||[]).forEach(x => { const {id, ...rest} = x; db.collection("tasks").add(rest); });
      (d.members||[]).forEach(x => {
        if(!members.some(m => m.name === x.name)){ const {id, ...rest} = x; db.collection("members").add(rest); }
      });
      (d.projects||[]).forEach(x => {
        if(!projects.some(p => p.name === x.name)){ const {id, ...rest} = x; db.collection("projects").add(rest); }
      });
    }catch(err){ alert("Invalid file"); }
  };
  r.readAsText(f);
};

/* ---------- Nav & misc ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  ["dashboard","board","projects","calendar","team","activity"].forEach(v => $("view-" + v).style.display = (v === b.dataset.view) ? "" : "none");
});
$("langBtn").onclick = () => { lang = (lang === "en") ? "ar" : "en"; localStorage.setItem("tt_lang", lang); applyLang(); };
["searchBox","filterPerson","filterProject","onlyMine"].forEach(id => $(id).addEventListener("input", renderBoard));

applyLang();
</script>
